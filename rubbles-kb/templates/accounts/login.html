{% extends 'base.html' %}
{% block title %}Вход — RUBBLES KB{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card card">
        <div class="card__body">
            <div style="text-align: center; margin-bottom: 24px;">
                <div style="width: 48px; height: 48px; background: linear-gradient(135deg, var(--primary), var(--accent)); border-radius: 12px; display: flex; align-items: center; justify-content: center; margin: 0 auto 12px;">
                    <i class="fas fa-brain" style="color: white; font-size: 24px;"></i>
                </div>
                <h1 style="font-size: 20px; font-weight: 600;">Добро пожаловать</h1>
                <p style="color: var(--text-secondary); font-size: 13px;">Войдите в базу знаний RUBBLES</p>
            </div>

            <form method="POST" class="auth-form">
                {% csrf_token %}
                <div class="form-group">
                    <label for="id_username">Имя пользователя</label>
                    <input type="text" name="username" id="id_username" class="form-input" required autofocus>
                </div>
                <div class="form-group">
                    <label for="id_password">Пароль</label>
                    <input type="password" name="password" id="id_password" class="form-input" required>
                </div>
                {% if form.errors %}
                    <div class="msg msg-error"><i class="fas fa-exclamation-circle"></i> Неверное имя пользователя или пароль</div>
                {% endif %}
                <button type="submit" class="btn btn-primary btn-block btn-lg"><i class="fas fa-sign-in-alt"></i> Войти</button>
            </form>

            <p class="form-footer" style="margin-top: 16px;">
                Нет аккаунта? <a href="{% url 'register' %}">Зарегистрироваться</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
