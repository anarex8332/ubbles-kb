{% extends 'base.html' %}
{% block title %}Вход — RUBBLES KB{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card card">
        <div class="card__header">
            <h1><i class="fas fa-sign-in-alt"></i> Вход</h1>
        </div>
        <div class="card__body">
            <form method="POST" class="auth-form">
                {% csrf_token %}
                <div class="form-group">
                    <label for="id_username">Имя пользователя</label>
                    <input type="text" name="username" id="id_username" class="form-input" required autofocus>
                </div>
                <div class="form-group">
                    <label for="id_password">Пароль</label>
                    <input type="password" name="password" id="id_password" class="form-input" required>
                </div>
                {% if form.errors %}
                    <div class="message message--error">Неверное имя пользователя или пароль</div>
                {% endif %}
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary btn-block"><i class="fas fa-sign-in-alt"></i> Войти</button>
                </div>
                <p class="form-footer">Нет аккаунта? <a href="{% url 'register' %}">Зарегистрироваться</a></p>
            </form>
        </div>
    </div>
</div>
{% endblock %}
