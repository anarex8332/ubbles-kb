{% extends 'base.html' %}
{% block title %}Редактирование профиля — RUBBLES KB{% endblock %}

{% block content %}
<div class="breadcrumbs">
    <a href="{% url 'knowledge:home' %}">Главная</a>
    <span class="breadcrumbs__sep">/</span>
    <a href="{% url 'profile' %}">Профиль</a>
    <span class="breadcrumbs__sep">/</span>
    <span>Редактировать</span>
</div>

<div class="page-header">
    <h1 class="page-title"><i class="fas fa-user-edit"></i> Редактирование профиля</h1>
</div>

<div class="card" style="max-width: 600px;">
    <div class="card__body">
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="form-group">
                <label for="id_username">Имя пользователя</label>
                <input type="text" name="username" id="id_username" value="{{ user_form.username.value }}" class="form-input" required>
            </div>

            <div class="form-group">
                <label for="id_email">Email</label>
                <input type="email" name="email" id="id_email" value="{{ user_form.email.value|default:'' }}" class="form-input" placeholder="your@email.com">
            </div>

            <div class="form-group">
                <label>Текущее фото</label>
                {% if user.profile.avatar %}
                    <div style="margin-bottom: 8px;">
                        <img src="{{ user.profile.avatar.url }}" alt="" style="width: 80px; height: 80px; border-radius: 50%; object-fit: cover;">
                    </div>
                {% endif %}
                <input type="file" name="avatar" accept="image/*" class="form-input" style="padding: 6px;">
                <small class="form-help">PNG, JPG. Максимум 2MB</small>
            </div>

            <div class="form-group">
                <label for="id_bio">О себе</label>
                <textarea name="bio" id="id_bio" rows="4" class="form-textarea" placeholder="Расскажите о себе...">{{ profile_form.bio.value|default:'' }}</textarea>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Сохранить</button>
                <a href="{% url 'profile' %}" class="btn btn-outline"><i class="fas fa-times"></i> Отмена</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
